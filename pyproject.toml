[project]
name = "joker"
version = "0.1.0"
description = "Semantic joke retrieval with Telegram reactions, HTTP, and MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp>=1,<2",
    "numpy>=2.5.3",
    "ollama>=0.6.2",
    "python-telegram-bot>=22,<23",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
